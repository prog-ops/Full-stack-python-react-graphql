# Main Data Type
type InventoryItem {
  itemId: ID!
  sku: String!
  name: String!
  category: String!
  warehouse: String!
  quantityOnHand: Int!
  reorderThreshold: Int!
  lastUpdated: String!
  stockStatus: String! # Dihitung secara dinamis oleh resolver (In Stock, Low Stock, Out of Stock)
}

type ImportSummary {
  totalRows: Int!
  acceptedRows: Int!
  rejectedRows: Int!
  validationErrors: [String!]!
}

# Enum for Sorting and Filtering
enum SortBy { NAME, QUANTITY, LAST_UPDATED }
enum SortOrder { ASC, DESC }

scalar Upload

# Queries (to read data)
type Query {
  items(
    search: String,
    category: String,
    warehouse: String,
    stockStatus: String,
    sortBy: String,
    sortDesc: Boolean = false,
    limit: Int = 100,
    skip: Int = 0
  ): [InventoryItem!]!
}

# Mutations (Untuk mengubah data / import CSV)
type Mutation {
  # Menerima data CSV yang sudah di-parse menjadi array of objects di frontend,
  # atau menerima file upload langsung (tergantung implementasi yang kita pilih nanti)
  importTransactions(file: Upload!): ImportSummary!
}